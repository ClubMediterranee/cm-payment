###
# This is triggered for each merge-request push (every commit on a branch with a merge-request to develop)
###
---
.dev_vars: &dev_vars
  APP_VERSION: '${CI_COMMIT_SHORT_SHA}'
  BUILD_ARG_APP_VERSION: '${CI_COMMIT_SHORT_SHA}'
  VERSION_STRATEGY: 'add'
  DOCKER_TAG: 'mr-${CI_MERGE_REQUEST_IID}'
  ENV: 'dev'

# @Description Build the storybook for dev branches
build_storybook_dev:
  extends: .docker_tag_and_push.aws # from @clubmed/templates:CI/library/docker-aws.yaml
  stage: storybook:dev
  needs:
    - lint
    - test
  variables:
    <<: *dev_vars
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_REF_NAME =~ "(next-release|master|develop)"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_MERGE_REQUEST_ID'
    - if: '$CI_MERGE_REQUEST_ID'
      when: on_success
    - when: never

# @Description Deploy the storybook for dev branches - Automatically stopped in 1 week
deploy_storybook_dev:
  extends: .deploy_docker_image_to_aws # from @clubmed/templates:CI/library/docker-aws.yaml
  stage: storybook:dev
  needs:
    - build_storybook_dev
  cache: {}
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_REF_NAME =~ "(next-release|master|develop)"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_MERGE_REQUEST_ID'
    - if: '$CI_MERGE_REQUEST_ID'
      when: on_success
    - when: never
  environment:
    name: 'branch/${CI_COMMIT_REF_SLUG}'
    url: 'https://${DOCKER_TAG}.${BASE_DN}'
    on_stop: stop_storybook_dev
    auto_stop_in: $ENV_DEV_LIFETIME
  variables:
    <<: *dev_vars
  script:
    - !reference [.deploy_docker_image_to_aws, script] # from @clubmed/templates:CI/library/docker-aws.yaml
    - !reference [.gitlab_api_utils_setup_apt, script] # from @clubmed/templates:CI/library/gitlab-api-utils.yaml
    - !reference [.gitlab_api_utils, script] # from @clubmed/templates:CI/library/gitlab-api-utils.yaml
    - !reference [.notify_gitlab_deployed_env, script] # from commons.yml

# @Description Stop (delete) the storybook for dev branches
stop_storybook_dev:
  extends: .deploy_docker_image_to_aws # from @clubmed/templates:CI/library/docker-aws.yaml
  stage: storybook:dev
  needs:
    - deploy_storybook_dev
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_REF_NAME =~ "(next-release|master|develop)"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_MERGE_REQUEST_ID'
    - if: '$CI_MERGE_REQUEST_ID'
      when: manual
    - when: never
  environment:
    name: 'branch/${CI_COMMIT_REF_SLUG}'
    action: stop
  variables:
    <<: *dev_vars
    VERSION_STRATEGY: 'delete'
  script:
    - !reference [.deploy_docker_image_to_aws, script] # from @clubmed/templates:CI/library/docker-aws.yaml
    - !reference [.gitlab_api_utils_setup_apt, script] # from @clubmed/templates:CI/library/gitlab-api-utils.yaml
    - !reference [.gitlab_api_utils, script] # from @clubmed/templates:CI/library/gitlab-api-utils.yaml
    - !reference [.notify_gitlab_deleted_env, script] # from commons.yml
  allow_failure: true
  cache: {}
