---

# @Description Lint all CI config files with YAMLlint for branches 'ci-*'
lint_ci:
  stage: test_ci
  image: python:3-bullseye
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^ci-/'
      when: always
    - when: never
  before_script:
    - !reference [.setup_proxy_linux, script]  # from @clubmed/templates:CI/library/commons.yaml
    - !reference [.setup_proxy_apt, script]  # from @clubmed/templates:CI/library/commons.yaml
  script:
    - pip install yamllint
    - yamllint .gitlab-ci.yml .gitlab/ci/
