.publish-npm-package:
  script:
    - rm .npmrc 2>/dev/null || true
    - echo "Publishing package to NPM"
    - npm config set strict-ssl false
    - npm config set -- "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
    - |
      if [ -n "${NPM_DIST_TAG}" ]; then
        npm publish --access public --tag "${NPM_DIST_TAG}"
      else
        npm publish --access public
      fi

.publish-gitlab-package:
  script:
    - echo "Publishing package to GITLAB"
    - rm .npmrc 2>/dev/null || true
    - npm config set @clubmed:registry "https://scm.clubmed.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
    - npm config set -- "//scm.clubmed.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}"
    - npm config set -- "//scm.clubmed.com/:_authToken=${CI_JOB_TOKEN}"
    - npm publish
