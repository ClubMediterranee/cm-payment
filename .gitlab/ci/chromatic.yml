---
# Reusable Chromatic CI scripts (to be composed in .gitlab-ci.yml jobs)

.chromatic_run:
  script:
    #    - set -o pipefail
    # Run Chromatic and capture output for parsing. Token can be provided via CHROMATIC_PROJECT_TOKEN or CHROMATIC_TOKEN
    - |

      CMD="$PM run chromatic $ARG_SEP --exit-zero-on-changes --diagnosticsFile=chromatic-diagnostics.json --branch-name ${CI_COMMIT_REF_NAME}"

      echo "Running: $CMD"
      # shellcheck disable=SC2086
      eval $CMD

      DIAG="chromatic-diagnostics.json"

      if [ ! -f "$DIAG" ]; then
        echo "Fichier $DIAG introuvable, rien à poster."
        exit 0
      fi

      # Ensure jq is installed (needed to parse Chromatic diagnostics)
      if ! command -v jq >/dev/null 2>&1; then
        echo "Installing jq..."
        apt-get update -y && apt-get install -y jq
        jq --version || true
      fi

      # Extraire status et url depuis le diagnostic
      STATUS=$(jq -r '.build.status // .announcedBuild.status // empty' "$DIAG")
      URL=$(jq -r '.build.webUrl // .announcedBuild.webUrl // empty' "$DIAG")

      if [ -z "$STATUS" ]; then
        echo "Status introuvable dans $DIAG"
        exit 0
      fi

      # Mapper status Chromatic -> GitLab state
      case "${STATUS^^}" in
        PENDING|RUNNING) GSTATE="pending" ;;
        PUBLISHED|COMPLETED|SUCCESS|OK) GSTATE="success" ;;
        FAILED|ERROR|ABORTED) GSTATE="failed" ;;
        *) GSTATE="pending" ;;
      esac

      DESCRIPTION="Chromatic: $STATUS"

      # Poster le status sur le commit (nécessite CI_API_V4_URL, CI_PROJECT_ID, CI_COMMIT_SHA, GITLAB_TOKEN)
      curl --silent --show-error --fail --retry 3 --retry-all-errors --max-time 60 --insecure -X POST "${CI_API_V4_URL%/}/projects/${CI_PROJECT_ID}/statuses/${CI_COMMIT_SHA}" \
        -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        -F "state=${GSTATE}" \
        -F "context=chromatic" \
        -F "target_url=${URL}" \
        -F "description=${DESCRIPTION}"

      echo "Posted chromatic status '${GSTATE}' (Chromatic=${STATUS}) -> ${URL:-no-url}"
