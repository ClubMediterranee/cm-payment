---
include:
  - project: "clubmed/templates"
    ref: "master"
    file: "CI/library/commons.yaml"
  - project: "clubmed/templates"
    ref: "master"
    file: "CI/library/docker.yaml"
  - project: "clubmed/templates"
    ref: "master"
    file: "CI/git-flow.yaml"
  - project: "clubmed/templates"
    ref: "master"
    file: "CI/library/gitlab-api-utils.yaml"
  - local: ".gitlab/ci/proxy.yml"
  - local: ".gitlab/ci/node.yml"
  - local: ".gitlab/ci/chromatic.yml"
  - local: ".gitlab/ci/deploy.yml"
  - local: ".gitlab/ci/dotenv-source.yml"
  - local: ".gitlab/ci/publish.yml"
  - local: ".gitlab/ci/switch-branch.yml"

variables:
  NODE_VERSION: 24.17.0
  NODE_IMG: "node:24.17.0-bullseye"
  SEMANTIC_RELEASE_OPTS: ""
  ENV:
    value: "integration"
    options:
      - "integration-heroku"
      - "staging-heroku"
      - "integration"
      - "staging"
      - "production"
    description: "The deployment target environment"
  VERSION:
    value: $CI_COMMIT_REF_NAME
    description: "The version or branch name to be deployed on environment."
  INFRA_BRANCH:
    value: "main"
    description: "ClubMed infra branch to deploy application"
  WORKFLOW:
    value: "build"
    options:
      - "build"
      - "deploy"
      - "rebase"
      - "rebase-all"
    description: "The workflow to be executed"
  BRANCH_DEV: "develop"
  BRANCH_MAIN: "main"
  BRANCH_RELEASE: "next-release"

stages:
  - test
  - storybook:dev
  - release
  - publish
  - release:make
  - deploy
  - notification

lint:
  extends: .node_install_dependencies
  stage: test
  variables:
    ESLINT_CODE_QUALITY_REPORT: gl-codequality.json
  script:
    - pnpm run lint --quiet --format eslint-formatter-gitlab
  artifacts:
    when: always
    reports:
      codequality: gl-codequality.json
    expire_in: 1 week
  rules:
    - if: '$WORKFLOW == "build"'
      when: always
    - when: never
build:
  extends: .node_install_dependencies
  stage: test
  script:
    - pnpm run check
    - pnpm run build
  artifacts:
    when: always
    paths:
      - packages/sdk/dist/
      - packages/sandbox/dist/
    expire_in: 1 week
  rules:
    - if: '$WORKFLOW == "build"'
      when: always
    - when: never
test:
  extends: .node_install_dependencies
  stage: test
  variables:
    NODE_IMG: "mcr.microsoft.com/playwright:v1.54.2"
  script:
    - node -e "console.log(process.env.AWS_ECR_ID.split('').join(' '))"
    - npx playwright install --with-deps
    - pnpm run test
  rules:
    - if: '$WORKFLOW == "build"'
      when: always
    - when: never

chromatic:
  extends: .node_install_dependencies
  stage: storybook:dev
  needs:
    - lint
    - test
    - build
  script:
    - !reference [.chromatic_run, script]
  rules:
    - if: '$WORKFLOW == "build" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$WORKFLOW == "build" && $CI_COMMIT_REF_NAME == $BRANCH_DEV && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
      when: always
    - when: never

release:
  extends: .node_install_dependencies
  stage: release
  needs:
    - lint
    - test
    - build
  rules:
    - if: '$WORKFLOW == "build" && $CI_COMMIT_REF_NAME =~ /main|develop|next-release/'
      when: on_success
    - when: never
  artifacts:
    when: always
    paths:
      - package.json
      - packages/sdk/package.json
    reports:
      dotenv: release.env
    expire_in: 1 week
  script:
    - !reference [.dotenv-source, script]
    - echo "RELEASE_CREATED=false" > release.env
    - pnpm run release

publish:
  extends: .node_install_dependencies
  stage: publish
  needs:
    - job: release
      artifacts: true
  rules:
    - if: '$WORKFLOW == "build" && $CI_COMMIT_REF_NAME =~ /main|develop|next-release/'
      when: on_success
    - when: never
  script:
    - |
      if [ "$RELEASE_CREATED" != "true" ]; then
        echo "No release generated. Skip npm publish."
        exit 0
      fi
    - node -e "const fs=require('node:fs'); const path='packages/sdk/package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=process.env.SDK_VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 2)+'\n');"
    - rm -rf ./packages/sdk/dist
    - pnpm --filter @clubmed/caps run build
    - cd ./packages/sdk/dist
    - !reference [.publish-npm-package, script]

# @Description Manually create a new release branch from develop
make-release:
  extends: .gitflow_release_create # from @clubmed/templates:CI/git-flow.yaml
  stage: release:make
  needs:
    - lint
    - test
    - build
  rules:
    - if: '$WORKFLOW == "build" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_REF_NAME == "develop"'
      when: manual
    - when: never
  cache: {}

deploy:
  extends: .node_dind
  stage: deploy
  tags:
    - xemoy05_heavy
  rules:
    - if: "$WORKFLOW == 'deploy'"
      when: always
    - when: never
  script:
    - !reference [.dotenv-source, script]
    - !reference [.switch-branch, script]
    - |
      if echo "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
        RELEASE_INFO_VERSION="$VERSION"
      else
        RELEASE_INFO_VERSION="${VERSION}-$(date -u +%Y%m%d%H%M%S)"
      fi
      export RELEASE_INFO_VERSION
      echo "$RELEASE_INFO_VERSION" > packages/server/resources/release.info
      echo "release.info version: $RELEASE_INFO_VERSION"
      echo "PROVIDER: $PROVIDER"
    - !reference [.deploy-on-heroku-with-parameters, script]
    - !reference [.deploy-on-aws-with-parameters, script]

post-deploy:
  extends: .node_install_dependencies
  stage: notification
  dependencies:
    - deploy
  rules:
    - if: "$WORKFLOW == 'deploy' && $ENV == 'production'"
      when: always
    - when: never
  script:
    - bunx @cmflow/cli@v3.0.1 cm jira-releases --project-id GPAY --component SDK-PAYMENT --tag $VERSION --verbose --update

rebase:
  extends: .node_install_dependencies
  stage: deploy
  rules:
    - if: "$WORKFLOW == 'rebase'"
      when: always
    - when: never
  script:
    - !reference [.dotenv-source, script]
    - yarn dlx -p @cmflow/cli cm push

rebase-all:
  extends: .node_install_dependencies
  stage: deploy
  rules:
    - if: "$WORKFLOW == 'rebase-all'"
      when: always
    - when: never
  script:
    - !reference [.dotenv-source, script]
    - yarn dlx -p @cmflow/cli cm republish

notify:
  stage: notification
  trigger:
    include: .gitlab/ci/notification.yml
    forward:
      pipeline_variables: true
  rules:
    - if: "$WORKFLOW == 'deploy'"
      when: always
