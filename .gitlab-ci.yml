---
include:
  - project: 'clubmed/templates'
    ref: 'master'
    file: 'CI/library/commons.yaml'
  - project: 'clubmed/templates'
    ref: 'master'
    file: 'CI/library/docker.yaml'
  - project: 'clubmed/templates'
    ref: 'master'
    file: 'CI/git-flow.yaml'
  - project: 'clubmed/templates'
    ref: 'master'
    file: 'CI/library/gitlab-api-utils.yaml'
  - local: '.gitlab/ci/commons.yml'
  - local: '.gitlab/ci/ci-lint.yml'
  - local: '.gitlab/ci/proxy.yml'
  - local: '.gitlab/ci/node.yml'
  - local: '.gitlab/ci/chromatic.yml'
  - local: '.gitlab/ci/deploy.yml'
  - local: '.gitlab/ci/dotenv-source.yml'
  - local: '.gitlab/ci/publish.yml'
  - local: '.gitlab/ci/switch-branch.yml'

variables:
  NODE_VERSION: 22.17.1
  NODE_IMG: 'node:22.17.0-bullseye'
  SEMANTIC_RELEASE_OPTS: ''
  DEPRECATION_MESSAGE: 'package deprecated from a manual action in CI - this version may be problematic'
  ENV:
    value: 'integration'
    options:
      - 'integration'
      - 'staging'
      - 'production'
    description: 'The deployment target environment'
  VERSION:
    value: '$CI_COMMIT_REF_NAME'
    description: 'The version or branch name to be deployed on environment.'
  WORKFLOW:
    value: 'build'
    options:
      - 'build'
      - 'deploy'
      - 'rebase'
      - 'rebase-all'
    description: 'The workflow to be executed'
  BRANCH_DEV: 'develop'
  BRANCH_MAIN: 'main'
  BRANCH_RELEASE: 'next-release'

workflow:
  rules:
    # trigger for any tag
    - if: '$CI_COMMIT_TAG'
      when: always
    # never trigger for releases creation
    - if: '$CI_COMMIT_REF_NAME == "develop" && $CI_COMMIT_MESSAGE =~ /^chore\(release\).*/'
      when: never
    # trigger when a merge-request is opened but do not trigger the default branch pipeline to avoid duplicate
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # final fallback: trigger for all commits & tags
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - test_ci
  - test
  - storybook:dev
  - release
  - release:make
  - deploy
  - notification
cache:
  - key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
      - .pnpm/
    policy: pull
    untracked: true

lint:
  extends: .node_install_dependencies
  stage: test
  variables:
    ESLINT_CODE_QUALITY_REPORT: gl-codequality.json
  script:
    - pnpm run lint --quiet --format eslint-formatter-gitlab
  artifacts:
    when: always
    reports:
      codequality: gl-codequality.json
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - if: '$WORKFLOW == "build" && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always
build:
  extends: .node_install_dependencies
  stage: test
  script:
    - pnpm run build
  artifacts:
    when: always
    paths:
      - packages/sdk/dist/
      - packages/sandbox/dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - if: '$WORKFLOW == "build" && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always
test:
  extends: .node_install_dependencies
  stage: test
  variables:
    NODE_IMG: 'mcr.microsoft.com/playwright:v1.54.2'
  script:
    - npx playwright install --with-deps
    - pnpm run test
  artifacts:
    when: always
    reports:
      junit: ./reports/vitest/test-results.xml
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - if: '$WORKFLOW == "build" && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

chromatic:
  extends: .node_install_dependencies
  stage: storybook:dev
  needs:
    - lint
    - test
    - build
  script:
    - !reference [.chromatic_run, script]
  rules:
    - if: '$WORKFLOW == "build" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never

release:
  extends: .node_install_dependencies
  stage: release
  needs:
    - lint
    - test
    - build
    - chromatic
  rules:
    - if: '$WORKFLOW == "build" && $CI_COMMIT_REF_NAME =~ /main|develop|next-release/'
      when: on_success
    - when: never
  script:
    - !reference [.prepare_npm_env, script] # from commons.yml
    - !reference [.dotenv-source, script]
    - pnpm run release
    - cd ./packages/sdk/dist
    - !reference [.publish-npm-package, script]

# @Description Manually create a new release branch from develop
make-release:
  extends: .gitflow_release_create # from @clubmed/templates:CI/git-flow.yaml
  stage: release:make
  needs:
    - lint
    - test
    - build
    - chromatic
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_REF_NAME == "develop"'
      when: manual
    - when: never
  cache: {}

deploy:
  extends: .node_dind
  stage: deploy
  rules:
    - if: "$WORKFLOW == 'deploy'"
      when: always
    - when: never
  script:
    - !reference [.switch-branch, script]
    - !reference [.dotenv-source, script]
    - echo $VERSION > resources/release.info
    - !reference [.deploy-with-parameters, script]
    - |
      if [ "$ENV" = "production" ]; then
        yarn install
        npx -p @cmflow/cli cm jira-releases --project-id CMAB --component ALGOLIA --tag $VERSION --verbose --update
      fi

rebase:
  extends: .node_install_dependencies
  stage: deploy
  rules:
    - if: "$WORKFLOW == 'rebase'"
      when: always
    - when: never
  script:
    - !reference [.dotenv-source, script]
    - yarn dlx -p @cmflow/cli cm push
    - !reference [.deploy-with-parameters, script]

rebase-all:
  extends: .node_install_dependencies
  stage: deploy
  rules:
    - if: "$WORKFLOW == 'rebase-all'"
      when: always
    - when: never
  script:
    - !reference [.dotenv-source, script]
    - yarn dlx -p @cmflow/cli cm republish

notify:
  stage: notification
  trigger:
    include: .gitlab/notification.yml
    forward:
      pipeline_variables: true
  rules:
    - if: "$WORKFLOW == 'deploy'"
      when: always
