---
include:
  - project: "clubmed/templates"
    ref: "master"
    file: "CI/library/commons.yaml"
  - project: "clubmed/templates"
    ref: "master"
    file: "CI/library/docker.yaml"
  - project: "clubmed/templates"
    ref: "master"
    file: "CI/git-flow.yaml"
  - project: "clubmed/templates"
    ref: "master"
    file: "CI/library/gitlab-api-utils.yaml"
  - local: ".gitlab/ci/proxy.yml"
  - local: ".gitlab/ci/node.yml"
  - local: ".gitlab/ci/chromatic.yml"
  - local: ".gitlab/ci/deploy.yml"
  - local: ".gitlab/ci/dotenv-source.yml"
  - local: ".gitlab/ci/publish.yml"
  - local: ".gitlab/ci/switch-branch.yml"

variables:
  NODE_VERSION: 22.17.1
  NODE_IMG: "node:22.17.0-bullseye"
  SEMANTIC_RELEASE_OPTS: ""
  ENV:
    value: "integration"
    options:
      - "integration"
      - "staging"
      - "production"
    description: "The deployment target environment"
  VERSION:
    value: "$CI_COMMIT_REF_NAME"
    description: "The version or branch name to be deployed on environment."
  WORKFLOW:
    value: "build"
    options:
      - "build"
      - "deploy"
      - "rebase"
      - "rebase-all"
    description: "The workflow to be executed"
  BRANCH_DEV: "develop"
  BRANCH_MAIN: "main"
  BRANCH_RELEASE: "next-release"

stages:
  - test
  - storybook:dev
  - release
  - release:make
  - deploy
  - notification
cache:
  - key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
      - .pnpm/
    policy: pull
    untracked: true

lint:
  extends: .node_install_dependencies
  stage: test
  variables:
    ESLINT_CODE_QUALITY_REPORT: gl-codequality.json
  script:
    - pnpm run lint --quiet --format eslint-formatter-gitlab
  artifacts:
    when: always
    reports:
      codequality: gl-codequality.json
    expire_in: 1 week
  rules:
    - if: '$WORKFLOW == "build"'
      when: always
    - when: never
build:
  extends: .node_install_dependencies
  stage: test
  script:
    - pnpm run build
  artifacts:
    when: always
    paths:
      - packages/sdk/dist/
      - packages/sandbox/dist/
    expire_in: 1 week
  rules:
    - if: '$WORKFLOW == "build"'
      when: always
    - when: never
test:
  extends: .node_install_dependencies
  stage: test
  variables:
    NODE_IMG: "mcr.microsoft.com/playwright:v1.54.2"
  script:
    - npx playwright install --with-deps
    - pnpm run test
  rules:
    - if: '$WORKFLOW == "build"'
      when: always
    - when: never

chromatic:
  extends: .node_install_dependencies
  stage: storybook:dev
  needs:
    - lint
    - test
    - build
  script:
    - !reference [.chromatic_run, script]
  rules:
    - if: '$WORKFLOW == "build" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never

release:
  extends: .node_install_dependencies
  stage: release
  needs:
    - lint
    - test
    - build
  rules:
    - if: '$WORKFLOW == "build" && $CI_COMMIT_REF_NAME =~ /main|develop|next-release/'
      when: on_success
    - when: never
  script:
    - !reference [.dotenv-source, script]
    - pnpm run release
    - cd ./packages/sdk/dist
    - !reference [.publish-npm-package, script]

# @Description Manually create a new release branch from develop
make-release:
  extends: .gitflow_release_create # from @clubmed/templates:CI/git-flow.yaml
  stage: release:make
  needs:
    - lint
    - test
    - build
  rules:
    - if: '$WORKFLOW == "build" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_REF_NAME == "develop"'
      when: manual
    - when: never
  cache: {}

deploy:
  extends: .node_dind
  stage: deploy
  rules:
    - if: "$WORKFLOW == 'deploy'"
      when: always
    - when: never
  script:
    - !reference [.switch-branch, script]
    - !reference [.dotenv-source, script]
    - echo $VERSION > packages/app/public/release.info
    - !reference [.deploy-with-parameters, script]
    - |
      if [ "$ENV" = "production" ]; then
        yarn install
        npx -p @cmflow/cli cm jira-releases --project-id GPAY --component SDK-PAYMENT --tag $VERSION --verbose --update
      fi

rebase:
  extends: .node_install_dependencies
  stage: deploy
  rules:
    - if: "$WORKFLOW == 'rebase'"
      when: always
    - when: never
  script:
    - !reference [.dotenv-source, script]
    - yarn dlx -p @cmflow/cli cm push
    - !reference [.deploy-with-parameters, script]

rebase-all:
  extends: .node_install_dependencies
  stage: deploy
  rules:
    - if: "$WORKFLOW == 'rebase-all'"
      when: always
    - when: never
  script:
    - !reference [.dotenv-source, script]
    - yarn dlx -p @cmflow/cli cm republish

notify:
  stage: notification
  trigger:
    include: .gitlab/ci/notification.yml
    forward:
      pipeline_variables: true
  rules:
    - if: "$WORKFLOW == 'deploy'"
      when: always
