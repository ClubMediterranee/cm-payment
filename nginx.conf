events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    server {
        listen ${PORT};
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;


        # Starter app - served at /starter  
        # Redirect bare /starter to include trailing slash for proper alias resolution
        location = /starter {
            return 301 /starter/;
        }
        location ^~ /starter {
            alias /usr/share/nginx/html/starter;
            try_files $uri $uri/ /starter/index.html;
        }

        # Storybook - served at /storybook
        # Redirect bare /storybook to include trailing slash for proper alias resolution
        location = /storybook {
            return 301 /storybook/;
        }
        location ^~ /storybook {
            alias /usr/share/nginx/html/storybook;
            try_files $uri $uri/ /storybook/index.html;
        }

        # Docs - served at /docs
        # Redirect bare /docs to include trailing slash for proper alias resolution
        location = /docs {
            return 301 /docs/;
        }
        location ^~ /docs {
            alias /usr/share/nginx/html/docs;
            try_files $uri $uri/ /docs/index.html;
        }


        # API proxy - forwards /api/* to upstream target (configured via $API_TARGET) removing the /api prefix
        # Example: API_TARGET=https://api.integ.clubmed.com
        # e.g., /api/v1/foo -> ${API_TARGET}/v1/foo
        location ^~ /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_redirect off;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_ssl_server_name on;
            # Strip the /api/ prefix by using a trailing slash on proxy_pass
            proxy_pass ${API_TARGET}/;
        }

        # Optional: ensure bare /api redirects to /api/
        location = /api {
            return 308 /api/;
        }

        # REST server proxy - forwards /rest/* to the Ts.ED Fastify server without stripping the prefix
        # Example: REST_TARGET=http://localhost:8083
        location ^~ /rest/ {
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_redirect off;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_pass ${REST_TARGET};
        }

        # Optional: ensure bare /rest requests are handled consistently
        location = /rest {
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            proxy_redirect off;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_pass ${REST_TARGET}/rest;
        }

        # Root app - serve front application at domain root
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Version endpoint - serves contents of /usr/share/nginx/html/version.json at /version
        location = /version {
            access_log off;
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /version.json =404;
        }

        # Handle static assets with proper caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
