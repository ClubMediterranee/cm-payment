version: "3.8"

services:
  payment-apps:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    container_name: cm-payment-apps
    restart: unless-stopped
    environment:
      - PORT=8080
      - NODE_ENV=${NODE_ENV:-development}
      - NGINX_HOST=localhost
      - NGINX_PORT=8080
      - API_TARGET=${API_TARGET:-https://api.integ.clubmed.com}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.payment-apps.rule=Host(`localhost`)"
      - "traefik.http.services.payment-apps.loadbalancer.server.port=8080"
      - "app.description=Club Med Payment Applications"
      - "app.app.path=/"
      - "app.starter.path=/starter"
      - "app.storybook.path=/storybook"

networks:
  default:
    driver: bridge
