version: '3.8'

services:
  payment-apps:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    container_name: cm-payment-apps
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NGINX_HOST=localhost
      - NGINX_PORT=80
      - API_TARGET=${API_TARGET:-https://api.integ.clubmed.com}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.payment-apps.rule=Host(`localhost`)'
      - 'traefik.http.services.payment-apps.loadbalancer.server.port=80'
      - 'app.description=Club Med Payment Applications'
      - 'app.app.path=/'
      - 'app.starter.path=/starter'
      - 'app.storybook.path=/storybook'

networks:
  default:
    driver: bridge
